<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #f8fafc; padding: 20px 0;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #115e59; padding: 24px; text-align: center; color: #ffffff;">
                            <h1 style="margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.025em;">Hütte Dangstetten</h1>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 32px 24px;">
                            <p style="margin: 0 0 16px 0; font-size: 1rem; color: #1e293b;">Hallo zusammen,</p>
                            
                            <div style="background-color: #f8fafc; border-left: 4px solid #0f766e; padding: 16px; border-radius: 4px; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.5; white-space: pre-line; color: #334155;">
                                {{message}}
                            </div>

                            <p style="margin: 0; font-size: 0.9rem; color: #64748b;">
                                Diese Nachricht wurde automatisch gesendet im Auftrag von: <strong>{{from_name}}</strong>.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f1f5f9; padding: 16px 24px; text-align: center; font-size: 0.75rem; color: #64748b; border-top: 1px solid #e2e8f0;">
                            © Hütte Dangstetten Portal. Alle Rechte vorbehalten.
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
