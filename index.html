Hier ist der konstruktive Architektur- und Logikplan dazu inkl. kritischer Punkte, die oft übersehen werden:

---

### 1. E-Mail-Bestätigung (Email Verification)

**Soll-Prozess:**
1. Nach Registrierung wird der Account als `is_verified = false` gespeichert.
2. Es wird ein kryptografisch sicherer Token (oder ein 6-stelliger Code) generiert, der mit einer Ablaufzeit (z. B. 24 Stunden) in der Datenbank gespeichert wird.
3. Der User erhält eine E-Mail mit einem Bestätigungslink (`/verify-email?token=xyz`).
4. Beim Klick wird `is_verified = true` gesetzt und der Token gelöscht/entwertet.

**Kritischer Einwand & Optimierung:**
* **Zugangsbeschränkung:** Soll der User sich vor der Verifizierung gar nicht einloggen können, oder darf er rein, sieht aber eine Sperre für bestimmte Funktionen? Ein *Hard-Lock* (kein Login ohne E-Mail-Bestätigung) ist sicherer und verhindert Spam-Leichen mit vollem Zugriff.
* **Resend-Button:** Denke zwingend an eine Funktion "Bestätigungs-E-Mail erneut senden" mit einem Rate-Limit (z. B. max. 1 Mail alle 60 Sekunden), falls die Mail im Spam landet.

---

### 2. E-Mail-Adresse ändern

**Soll-Prozess:**
1. Der User gibt im Profilbereich seine neue E-Mail-Adresse ein.
2. Zur Sicherheit muss er sein **aktuelles Passwort** erneut eingeben (Schutz vor Session-Hijacking).
3. **Wichtig:** Die neue E-Mail-Adresse wird *nicht* sofort überschrieben, sondern in einem Feld `pending_email` gespeichert.
4. Eine Bestätigungs-E-Mail geht an die **neue** E-Mail-Adresse.
5. Erst nach Klick auf den Bestätigungslink wird `email = pending_email` gesetzt und `pending_email` geleert.

**Kritischer Einwand & Optimierung:**
* Ändert man die E-Mail sofort ohne Verifizierung der neuen Adresse, kann sich der User bei einem Tippfehler selbst aussperren.
* Zusätzlich sollte eine Benachrichtigung an die *alte* E-Mail-Adresse geschickt werden ("Ihre E-Mail-Adresse wurde geändert"), falls das Konto kompromittiert wurde.

---

### 3. Login per Google (OAuth 2.0 / OpenID Connect)

**Soll-Prozess:**
1. Einbindung des Google-Sign-In-Buttons im Frontend.
2. Der User authentifiziert sich bei Google.
3. Das Backend empfängt das ID-Token von Google, verifiziert es über die Google-Bibliotheken und liest E-Mail sowie Google-ID (`sub`) aus.

**Kritischer Einwand & Account-Merging Logik:**
* **Automatische Verifizierung:** E-Mail-Adressen, die über Google einloggen, gelten bei Google bereits als verifiziert. Hier entfällt der manuelle E-Mail-Bestätigungsschritt.
* **Das E-Mail-Konflikt-Problem:** Was passiert, wenn sich jemand erst per E-Mail/Passwort registriert (`user@gmail.com`) und später auf "Mit Google anmelden" klickt?
  * *Falsch:* Einen zweiten Account anlegen oder den Login verweigern.
  * *Richtig:* Wenn die E-Mail-Adresse bereits existiert **und** verifiziert ist, verknüpfe die `google_id` mit dem bestehenden Account.

---

### Erforderliche Datenbankschema-Anpassungen

| Feld | Typ | Beschreibung |
| :--- | :--- | :--- |
| `is_verified` | Boolean (Default: `false`) | Status der E-Mail-Bestätigung |
| `verification_token` | String (Nullable) | Hash des E-Mail-Bestätigungstokens |
| `verification_expires` | Timestamp (Nullable) | Ablaufdatum des Tokens |
| `pending_email` | String (Nullable) | Neue E-Mail bis zur Bestätigung |
| `google_id` | String (Nullable, Unique) | Eindeutige ID von Google für OAuth |
