<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hütte Dangstetten - Portal & Chat</title>
    
    <!-- Flatpickr & Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #128C7E;
            --primary-dark: #075E54;
            --accent: #25D366;
            --bg-color: #ece5dd;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            max-width: 750px;
            width: 100%;
        }

        header {
            background-color: var(--primary-dark);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 { margin: 0; font-size: 1.4rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        input, select, textarea { 
            width: 100%; padding: 12px;
            border: 1px solid #ccc; border-radius: 6px; font-family: inherit;
            font-size: 16px;
        }

        button { 
            background-color: var(--primary); color: white; border: none; 
            padding: 12px 15px; border-radius: 6px; cursor: pointer; 
            width: 100%; font-weight: bold; transition: background 0.2s;
            margin-top: 5px; font-size: 1rem;
        }
        button:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: #34495e; }
        .btn-secondary:hover { background-color: #2c3e50; }
        .btn-google { background-color: #4285F4; margin-top: 10px; }
        .btn-google:hover { background-color: #357ae8; }
        .btn-link { background: none; color: var(--primary-dark); border: none; text-decoration: underline; width: auto; cursor: pointer; padding: 0; font-size: 0.9em; }
        .logout-btn { background-color: #7f8c8d; margin-top: 20px; }
        
        .hidden { display: none !important; }
        .message { color: #d35400; font-size: 0.9em; margin-top: 10px; }
        .alert-box { background: #fff3cd; border: 1px solid #ffe8a1; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 15px; border-radius: 6px; }
        .card { background: #f9f9f9; padding: 12px; margin-top: 10px; border-radius: 8px; border-left: 4px solid var(--primary); }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            margin-top: 5px;
        }

        #map { 
            height: 100%; 
            width: 100%; 
            border-radius: 6px; 
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Hütte Dangstetten</h1>
    </header>

    <!-- VERIFIZIERUNGSHINWEIS -->
    <div id="verify-banner" class="alert-box hidden">
        <strong>E-Mail-Bestätigung ausstehend!</strong><br>
        Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir gesendet haben.<br>
        <button id="resend-verify-btn" class="btn-link" style="margin-top: 5px;">Bestätigungs-E-Mail erneut senden</button>
    </div>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <h2 id="auth-title">Anmelden</h2>
        
        <div class="form-group" id="name-group" style="display:none;">
            <label>Name</label>
            <input type="text" id="auth-name" placeholder="Dein Name">
        </div>

        <div class="form-group">
            <label>E-Mail</label>
            <input type="email" id="auth-email" placeholder="beispiel@domain.de">
        </div>

        <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>

        <button id="auth-submit-btn">Anmelden</button>
        <button id="google-login-btn" class="btn-google">Mit Google anmelden</button>

        <p style="text-align: center; margin-top: 15px;">
            <span id="auth-toggle-text">Noch keinen Account?</span>
            <button id="auth-toggle-btn" class="btn-link">Registrieren</button>
        </p>
        <div id="auth-message" class="message"></div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="app-section" class="hidden">
        <h3>Willkommen, <span id="user-display-name"></span>!</h3>
        
        <!-- E-MAIL ÄNDERN SECTION -->
        <div class="card">
            <h4>E-Mail-Adresse ändern</h4>
            <div class="form-group">
                <input type="email" id="new-email-input" placeholder="Neue E-Mail-Adresse">
            </div>
            <button id="change-email-btn" class="btn-secondary">Neue E-Mail anfordern</button>
            <div id="email-change-msg" class="message"></div>
        </div>

        <br>
        <button id="logout-btn" class="logout-btn">Abmelden</button>
    </div>
</div>

<!-- Firebase Modular SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged,
        sendEmailVerification,
        verifyBeforeUpdateEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Konfiguration
    const keyPart1 = "AIzaSyCLhOlcwKeqtdNNF_";
    const keyPart2 = "HrFA0xavgOgZjHMPw";

    const firebaseConfig = {
        apiKey: keyPart1 + keyPart2,
        authDomain: "huette-dangstetten-3a737.firebaseapp.com",
        projectId: "huette-dangstetten-3a737",
        storageBucket: "huette-dangstetten-3a737.firebasestorage.app",
        messagingSenderId: "700971650309",
        appId: "1:700971650309:web:0793b2667578bc8eea7b6c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegistering = false;

    // DOM-Elemente
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authTitle = document.getElementById('auth-title');
    const nameGroup = document.getElementById('name-group');
    const authName = document.getElementById('auth-name');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const authToggleText = document.getElementById('auth-toggle-text');
    const authMessage = document.getElementById('auth-message');
    const verifyBanner = document.getElementById('verify-banner');
    const resendVerifyBtn = document.getElementById('resend-verify-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const logoutBtn = document.getElementById('logout-btn');
    const newEmailInput = document.getElementById('new-email-input');
    const changeEmailBtn = document.getElementById('change-email-btn');
    const emailChangeMsg = document.getElementById('email-change-msg');

    // Modus Umschalten (Login / Registrieren)
    authToggleBtn.addEventListener('click', () => {
        isRegistering = !isRegistering;
        authTitle.innerText = isRegistering ? 'Registrieren' : 'Anmelden';
        authSubmitBtn.innerText = isRegistering ? 'Account erstellen' : 'Anmelden';
        nameGroup.style.display = isRegistering ? 'block' : 'none';
        authToggleText.innerText = isRegistering ? 'Bereits einen Account?' : 'Noch keinen Account?';
        authToggleBtn.innerText = isRegistering ? 'Anmelden' : 'Registrieren';
        authMessage.innerText = '';
    });

    // Login & Registrierung mit E-Mail/Passwort
    authSubmitBtn.addEventListener('click', async () => {
        const email = authEmail.value.trim();
        const password = authPassword.value;
        const name = authName.value.trim();

        authMessage.innerText = '';

        if (!email || !password) {
            authMessage.innerText = 'Bitte E-Mail und Passwort eingeben.';
            return;
        }

        try {
            if (isRegistering) {
                if (!name) {
                    authMessage.innerText = 'Bitte gib deinen Namen ein.';
                    return;
                }
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // User in Firestore anlegen
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: 'user'
                });

                // Verifizierungs-E-Mail senden
                await sendEmailVerification(user);
                authMessage.style.color = 'green';
                authMessage.innerText = 'Account erstellt! Bitte überprüfe dein E-Mail-Postfach zur Bestätigung.';
            } else {
                await signInWithEmailAndPassword(auth, email, password);
            }
        } catch (error) {
            authMessage.style.color = '#d35400';
            authMessage.innerText = 'Fehler: ' + error.message;
        }
    });

    // Google Login
    googleLoginBtn.addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;

            // Prüfen ob User bereits in Firestore existiert, falls nicht -> erstellen
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists()) {
                await setDoc(doc(db, "users", user.uid), {
                    name: user.displayName || 'Google-Nutzer',
                    email: user.email,
                    role: 'user'
                });
            }
        } catch (error) {
            authMessage.style.color = '#d35400';
            authMessage.innerText = 'Google-Login Fehler: ' + error.message;
        }
    });

    // Auth-Status Beobachter
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');

            // E-Mail Verifizierungs-Banner anzeigen falls nicht verifiziert
            if (!user.emailVerified) {
                verifyBanner.classList.remove('hidden');
            } else {
                verifyBanner.classList.add('hidden');
            }

            // User-Name aus Firestore laden
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                userDisplayName.innerText = userDoc.data().name;
            } else {
                userDisplayName.innerText = user.email;
            }
        } else {
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
            verifyBanner.classList.add('hidden');
        }
    });

    // Verifizierungs-E-Mail erneut senden
    resendVerifyBtn.addEventListener('click', async () => {
        if (auth.currentUser) {
            try {
                await sendEmailVerification(auth.currentUser);
                alert('Bestätigungs-E-Mail wurde erneut gesendet!');
            } catch (error) {
                alert('Fehler beim Senden: ' + error.message);
            }
        }
    });

    // E-Mail-Adresse ändern
    changeEmailBtn.addEventListener('click', async () => {
        const newEmail = newEmailInput.value.trim();
        emailChangeMsg.innerText = '';

        if (!newEmail) {
            emailChangeMsg.innerText = 'Bitte eine neue E-Mail-Adresse eingeben.';
            return;
        }

        try {
            await verifyBeforeUpdateEmail(auth.currentUser, newEmail);
            emailChangeMsg.style.color = 'green';
            emailChangeMsg.innerText = 'Eine Bestätigungs-E-Mail wurde an die neue Adresse gesendet. Die Änderung wird aktiv, sobald du den Link in der Mail anklickst.';
        } catch (error) {
            emailChangeMsg.style.color = '#d35400';
            emailChangeMsg.innerText = 'Fehler: ' + error.message;
        }
    });

    // Abmelden
    logoutBtn.addEventListener('click', () => {
        signOut(auth);
    });
</script>

</body>
</html>
