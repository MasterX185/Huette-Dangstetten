<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hütte Dangstetten - Portal & Chat</title>
    
    <!-- Flatpickr (Kalender) & Leaflet (Karte) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #128C7E;
            --primary-dark: #075E54;
            --accent: #25D366;
            --bg-color: #ece5dd;
            --card-bg: #ffffff;
            --text-color: #333333;
            --chat-my-msg: #dcf8c6;
            --chat-other-msg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            max-width: 750px;
            width: 100%;
        }

        header {
            background-color: var(--primary-dark);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 { margin: 0; font-size: 1.4rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        input, select, textarea { 
            width: 100%; padding: 12px;
            border: 1px solid #ccc; border-radius: 6px; font-family: inherit;
            font-size: 16px;
        }

        /* NEUES CHIP-/KARTEN-SYSTEM FÜR NUTZERAUSWAHL */
        .user-chips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background: #f9f9f9;
            /* Verhindert Textmarkierung beim Gedrückthalten auf Handys */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .user-chip {
            background: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-chip:active {
            transform: scale(0.97);
        }

        .user-chip.selected {
            background: #e8f8f5;
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .user-chip-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background: #fff;
            flex-shrink: 0;
        }

        .user-chip.selected .user-chip-icon {
            background: var(--primary);
            border-color: var(--primary);
        }

        .user-chip-info {
            overflow: hidden;
        }

        .user-chip-name {
            font-weight: bold;
            font-size: 0.85em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-chip-email {
            font-size: 0.7em;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .select-all-box {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        button { 
            background-color: var(--primary); color: white; border: none; 
            padding: 12px 15px; border-radius: 6px; cursor: pointer; 
            width: 100%; font-weight: bold; transition: background 0.2s;
            margin-top: 5px; font-size: 1rem;
        }
        button:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: #34495e; }
        .btn-secondary:hover { background-color: #2c3e50; }
        .btn-link { background: none; color: var(--primary-dark); border: none; text-decoration: underline; width: auto; cursor: pointer; padding: 0; font-size: 0.9em; }
        .logout-btn { background-color: #7f8c8d; margin-top: 20px; }
        .delete-btn { background-color: #e74c3c; margin-top: 10px; }
        .small-btn { width: auto; padding: 6px 12px; font-size: 0.8em; margin: 2px; }

        .hidden { display: none !important; }
        .message { color: #d35400; font-size: 0.9em; margin-top: 10px; }
        .card { background: #f9f9f9; padding: 12px; margin-top: 10px; border-radius: 8px; border-left: 4px solid var(--primary); display: flex; flex-direction: column; gap: 8px; }
        
        @media (min-width: 480px) {
            .card { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .badge-admin { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; }
        .badge-user { background: #3498db; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.75em; }
        .admin-section-box { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fafafa; margin-top: 15px; }

        /* MOBIL-OPTIMIERTER KARTEN-CONTAINER MIT FADENKREUZ */
        .map-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            margin-top: 5px;
        }

        #map { 
            height: 100%; 
            width: 100%; 
            border-radius: 6px; 
            z-index: 1;
            touch-action: pan-x pan-y;
        }

        .map-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-top: -10px;
            margin-left: -10px;
            pointer-events: none;
            z-index: 1000;
        }

        .map-crosshair::before, .map-crosshair::after {
            content: '';
            position: absolute;
            background: #e74c3c;
        }

        .map-crosshair::before {
            top: 9px; left: 0; width: 20px; height: 2px;
        }

        .map-crosshair::after {
            top: 0; left: 9px; width: 2px; height: 20px;
        }

        /* RESPONSIVER CHAT */
        .chat-container {
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 450px;
            margin-top: 15px;
            background: #efeae2;
            overflow: hidden;
        }

        @media (min-width: 600px) {
            .chat-container { flex-direction: row; }
        }

        .chat-users-list {
            width: 100%;
            max-height: 120px;
            border-bottom: 1px solid #ccc;
            background: #fff;
            overflow-y: auto;
        }

        @media (min-width: 600px) {
            .chat-users-list {
                width: 35%;
                max-height: none;
                border-bottom: none;
                border-right: 1px solid #ccc;
            }
        }

        .user-chat-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 0.9em;
        }

        .user-chat-item:hover, .user-chat-item.active {
            background-color: #f0f2f5;
            font-weight: bold;
        }

        .chat-main {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 600px) {
            .chat-main { width: 65%; }
        }

        .chat-header {
            padding: 10px;
            background: #f0f2f5;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            font-size: 0.9em;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            word-wrap: break-word;
        }

        .chat-bubble.sent {
            background-color: var(--chat-my-msg);
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .chat-bubble.received {
            background-color: var(--chat-other-msg);
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .chat-time {
            font-size: 0.65em;
            color: #888;
            text-align: right;
            margin-top: 3px;
        }

        .chat-input-area {
            display: flex;
            padding: 8px;
            background: #f0f2f5;
            border-top: 1px solid #ccc;
        }

        .chat-input-area input {
            flex: 1;
            margin-right: 8px;
            border-radius: 20px;
            border: 1px solid #ccc;
            padding: 8px 15px;
        }

        .chat-input-area button {
            width: auto;
            border-radius: 20px;
            padding: 8px 15px;
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Hütte Dangstetten</h1>
    </header>

    <!-- AUTH SECTION -->
    <div id="auth-section">
        <h2 id="auth-title">Anmelden</h2>
        
        <div class="form-group" id="group-name" style="display: none;">
            <label for="name">Vollständiger Name</label>
            <input type="text" id="name" placeholder="Max Mustermann">
        </div>

        <div class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" placeholder="beispiel@domain.de">
        </div>

        <div class="form-group" id="group-password">
            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="Passwort">
        </div>

        <button id="btn-login">Anmelden</button>
        <button id="btn-register" class="btn-secondary hidden">Konto erstellen</button>
        <button id="btn-reset-pw" class="btn-secondary hidden">Passwort-Reset senden</button>

        <div style="display: flex; justify-content: space-between; margin-top: 15px;">
            <button id="link-toggle-reg" class="btn-link">Konto erstellen</button>
            <button id="link-forgot-pw" class="btn-link">Passwort vergessen?</button>
        </div>

        <p id="auth-error" class="message"></p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden">
        <h2>Hallo, <span id="user-display-name"></span>! 👋</h2>
        <p style="font-size: 0.85em; color: #666;">Angemeldet als: <span id="user-email"></span></p>

        <!-- CHAT SECTION -->
        <h3>💬 Direktnachrichten</h3>
        <div class="chat-container">
            <div class="chat-users-list" id="chat-users-list"></div>
            <div class="chat-main">
                <div class="chat-header" id="chat-header-title">Wähle einen Chat aus</div>
                <div class="chat-messages" id="chat-messages-box">
                    <p style="text-align: center; color: #888; font-size: 0.85em; margin-top: 20px;">Wähle oben/links eine Person aus, um zu chatten.</p>
                </div>
                <div class="chat-input-area hidden" id="chat-input-area">
                    <input type="text" id="chat-input-msg" placeholder="Nachricht schreiben...">
                    <button id="btn-send-chat">Senden</button>
                </div>
            </div>
        </div>

        <!-- EINLADUNGEN BEREICH -->
        <h3 style="margin-top: 30px;">📅 Deine Einladungen</h3>
        <div id="invitation-list">Lädt Einladungen...</div>

        <!-- BEREICH NUR FÜR ADMIN -->
        <div id="admin-view" class="hidden">
            <div class="admin-section-box">
                <h3>👑 Admin: Einladung senden</h3>
                
                <div class="form-group">
                    <label>Empfänger durch Antippen auswählen:</label>
                    <div class="select-all-box">
                        <button type="button" class="btn-secondary small-btn" id="btn-select-all">Alle auswählen</button>
                        <button type="button" class="btn-secondary small-btn" id="btn-deselect-all">Auswahl aufheben</button>
                    </div>
                    <div class="user-chips-grid" id="invite-user-chips">
                        <!-- Nutzer-Chips werden per JS geladen -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="invite-date">Datum & Uhrzeit</label>
                    <input type="text" id="invite-date" placeholder="Datum wählen...">
                </div>

                <div class="form-group">
                    <label>Treffpunkt festlegen:</label>
                    <div class="map-wrapper">
                        <div id="map"></div>
                        <div class="map-crosshair"></div>
                    </div>
                    <button type="button" id="btn-set-location" class="btn-secondary" style="margin-top: 8px;">📍 Standort unter dem Fadenkreuz wählen</button>
                    <small id="location-status" style="display:block; margin-top: 5px; color: #27ae60; font-weight: bold;"></small>
                </div>

                <div class="form-group">
                    <label for="invite-details">Infos / Details</label>
                    <textarea id="invite-details" rows="2" placeholder="Zusätzliche Infos..."></textarea>
                </div>

                <button id="btn-send-invite">Einladung speichern & Mail-Programm öffnen</button>
                <p id="admin-msg" class="message"></p>
            </div>

            <div class="admin-section-box">
                <h3>Nutzerverwaltung</h3>
                <div id="admin-users-list">Lädt...</div>
            </div>

            <div class="admin-section-box">
                <h3>Alle Einladungen verwalten</h3>
                <div id="admin-invitations-list">Lädt...</div>
            </div>
        </div>

        <button id="btn-logout" class="logout-btn">Abmelden</button>
        <button id="btn-delete-account" class="delete-btn">Eigenes Konto löschen</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
      sendPasswordResetEmail, signOut, onAuthStateChanged, deleteUser
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
      getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, deleteDoc,
      collection, query, where, orderBy, getDocs, onSnapshot, serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCLhOlcwKeqtdNNF_HrFA0xavgOgZjHMPw",
    authDomain: "huette-dangstetten-3a737.firebaseapp.com",
    projectId: "huette-dangstetten-3a737",
    storageBucket: "huette-dangstetten-3a737.firebasestorage.app",
    messagingSenderId: "700971650309",
    appId: "1:700971650309:web:0793b2667578bc8eea7b6c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUserData = null;
  let selectedChatPartner = null;
  let chatUnsubscribe = null;
  let map = null, marker = null;
  let selectedLat = 47.5756, selectedLng = 8.2436;

  flatpickr("#invite-date", { enableTime: true, dateFormat: "d.m.Y H:i", locale: "de", minDate: "today" });

  // AUTH UI UMSCHALTUNG
  let authMode = 'login';
  const authError = document.getElementById('auth-error');

  document.getElementById('link-toggle-reg').addEventListener('click', () => {
      if (authMode === 'login') {
          authMode = 'register';
          document.getElementById('auth-title').textContent = "Konto erstellen";
          document.getElementById('group-name').style.display = 'block';
          document.getElementById('group-password').style.display = 'block';
          document.getElementById('btn-login').classList.add('hidden');
          document.getElementById('btn-register').classList.remove('hidden');
          document.getElementById('btn-reset-pw').classList.add('hidden');
          document.getElementById('link-toggle-reg').textContent = "Zurück zum Login";
      } else {
          showLoginMode();
      }
  });

  document.getElementById('link-forgot-pw').addEventListener('click', () => {
      authMode = 'reset';
      document.getElementById('auth-title').textContent = "Passwort zurücksetzen";
      document.getElementById('group-name').style.display = 'none';
      document.getElementById('group-password').style.display = 'none';
      document.getElementById('btn-login').classList.add('hidden');
      document.getElementById('btn-register').classList.add('hidden');
      document.getElementById('btn-reset-pw').classList.remove('hidden');
      document.getElementById('link-toggle-reg').textContent = "Zurück zum Login";
  });

  function showLoginMode() {
      authMode = 'login';
      document.getElementById('auth-title').textContent = "Anmelden";
      document.getElementById('group-name').style.display = 'none';
      document.getElementById('group-password').style.display = 'block';
      document.getElementById('btn-login').classList.remove('hidden');
      document.getElementById('btn-register').classList.add('hidden');
      document.getElementById('btn-reset-pw').classList.add('hidden');
      document.getElementById('link-toggle-reg').textContent = "Noch kein Konto? Registrieren";
  }

  // PASSWORT ZURÜCKSETZEN
  document.getElementById('btn-reset-pw').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      authError.textContent = '';
      if (!email) { authError.textContent = "Bitte E-Mail angeben."; return; }
      try {
          await sendPasswordResetEmail(auth, email);
          authError.style.color = "green";
          authError.textContent = "Passwort-Reset-E-Mail wurde gesendet!";
      } catch (error) {
          authError.style.color = "#d35400";
          authError.textContent = "Fehler: " + error.message;
      }
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
      authError.textContent = '';
      try {
          await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
      } catch (err) { authError.style.color = "#d35400"; authError.textContent = err.message; }
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      authError.textContent = '';
      if (!name || !email || !password) return alert("Bitte alle Felder ausfüllen!");

      try {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "users", cred.user.uid), { name, email, role: "user" });
      } catch (err) { authError.style.color = "#d35400"; authError.textContent = err.message; }
  });

  document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

  // EIGENES KONTO LÖSCHEN
  document.getElementById('btn-delete-account').addEventListener('click', async () => {
      if (!confirm("Möchtest du dein Konto unwiderruflich löschen?")) return;
      const user = auth.currentUser;
      if (user) {
          try {
              await deleteDoc(doc(db, "users", user.uid));
              await deleteUser(user);
              alert("Konto erfolgreich gelöscht.");
          } catch (error) {
              alert("Fehler beim Löschen: " + error.message + "\n(Melde dich bitte kurz ab, wieder an und versuche es erneut).");
          }
      }
  });

  onAuthStateChanged(auth, async (user) => {
      if (user) {
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');
          document.getElementById('user-email').textContent = user.email;

          const uDoc = await getDoc(doc(db, "users", user.uid));
          if (uDoc.exists()) {
              currentUserData = { uid: user.uid, ...uDoc.data() };
              document.getElementById('user-display-name').textContent = currentUserData.name || user.email;

              if (currentUserData.role === 'admin') {
                  document.getElementById('admin-view').classList.remove('hidden');
                  loadAdminUsers();
                  loadAdminInvitations();
                  initMap();
              } else {
                  document.getElementById('admin-view').classList.add('hidden');
              }
          }
          loadInvitations(user.email);
          loadChatUsersList();
      } else {
          document.getElementById('auth-section').classList.remove('hidden');
          document.getElementById('dashboard-section').classList.add('hidden');
          showLoginMode();
      }
  });

  // CHAT SYSTEM
  function loadChatUsersList() {
      onSnapshot(collection(db, "users"), (snapshot) => {
          const listEl = document.getElementById('chat-users-list');
          listEl.innerHTML = '';
          snapshot.forEach(docSnap => {
              const u = docSnap.data();
              if (docSnap.id !== auth.currentUser.uid) {
                  const div = document.createElement('div');
                  div.className = 'user-chat-item';
                  div.innerHTML = `<strong>${u.name || 'Unbekannt'}</strong><br><small style="color:#777">${u.email}</small>`;
                  div.onclick = () => openChat({ uid: docSnap.id, name: u.name, email: u.email }, div);
                  listEl.appendChild(div);
              }
          });
      });
  }

  function openChat(partner, itemEl) {
      selectedChatPartner = partner;
      document.querySelectorAll('.user-chat-item').forEach(el => el.classList.remove('active'));
      if(itemEl) itemEl.classList.add('active');

      document.getElementById('chat-header-title').textContent = partner.name || partner.email;
      document.getElementById('chat-input-area').classList.remove('hidden');

      if (chatUnsubscribe) chatUnsubscribe();

      const chatId = [auth.currentUser.uid, partner.uid].sort().join('_');
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

      chatUnsubscribe = onSnapshot(q, (snapshot) => {
          const box = document.getElementById('chat-messages-box');
          box.innerHTML = '';
          snapshot.forEach(docSnap => {
              const msg = docSnap.data();
              const isMine = msg.senderUid === auth.currentUser.uid;
              const timeStr = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

              const bubble = document.createElement('div');
              bubble.className = `chat-bubble ${isMine ? 'sent' : 'received'}`;
              bubble.innerHTML = `${msg.text}<div class="chat-time">${timeStr}</div>`;
              box.appendChild(bubble);
          });
          box.scrollTop = box.scrollHeight;
      }, (error) => {
          console.error("Chat-Fehler:", error);
      });
  }

  document.getElementById('btn-send-chat').addEventListener('click', sendChatMessage);
  document.getElementById('chat-input-msg').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChatMessage();
  });

  async function sendChatMessage() {
      const textInput = document.getElementById('chat-input-msg');
      const text = textInput.value.trim();
      if (!text || !selectedChatPartner) return;

      const chatId = [auth.currentUser.uid, selectedChatPartner.uid].sort().join('_');
      textInput.value = '';

      await addDoc(collection(db, "chats", chatId, "messages"), {
          senderUid: auth.currentUser.uid,
          text: text,
          timestamp: serverTimestamp()
      });
  }

  // ADMIN VERWALTUNG & LISTEN
  function loadAdminUsers() {
      onSnapshot(collection(db, "users"), (snapshot) => {
          const chipsContainer = document.getElementById('invite-user-chips');
          const usersList = document.getElementById('admin-users-list');
          chipsContainer.innerHTML = '';
          usersList.innerHTML = '';

          snapshot.forEach(docSnap => {
              const u = docSnap.data();
              const uid = docSnap.id;

              // Visuelle Kachel/Chip erstellen (Touch-optimiert)
              const chip = document.createElement('div');
              chip.className = 'user-chip';
              chip.dataset.userData = JSON.stringify({email: u.email, name: u.name});
              chip.innerHTML = `
                  <div class="user-chip-icon">✓</div>
                  <div class="user-chip-info">
                      <div class="user-chip-name">${u.name || 'Unbekannt'}</div>
                      <div class="user-chip-email">${u.email}</div>
                  </div>
              `;
              
              // Klick/Tipp-Event zum Auswählen / Abwählen
              chip.addEventListener('click', () => {
                  chip.classList.toggle('selected');
              });

              chipsContainer.appendChild(chip);

              // Eintrag in Admin-Nutzerliste erstellen
              const isSelf = auth.currentUser && auth.currentUser.uid === uid;
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                  <div>
                      <strong>${u.name || 'Ohne Name'}</strong> (${u.email}) 
                      <span class="${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span>
                  </div>
                  <div>
                      ${!isSelf ? `
                          <button class="small-btn btn-secondary" onclick="toggleRole('${uid}', '${u.role}')">Rolle ändern</button>
                          <button class="small-btn delete-btn" onclick="deleteUserDoc('${uid}')">Löschen</button>
                      ` : '<em>(Du)</em>'}
                  </div>
              `;
              usersList.appendChild(card);
          });
      });
  }

  // Alle auswählen / Auswahl aufheben Buttons
  document.getElementById('btn-select-all').addEventListener('click', () => {
      document.querySelectorAll('.user-chip').forEach(chip => chip.classList.add('selected'));
  });

  document.getElementById('btn-deselect-all').addEventListener('click', () => {
      document.querySelectorAll('.user-chip').forEach(chip => chip.classList.remove('selected'));
  });

  function loadAdminInvitations() {
      onSnapshot(collection(db, "invitations"), (snapshot) => {
          const invList = document.getElementById('admin-invitations-list');
          invList.innerHTML = snapshot.empty ? '<p>Keine Einladungen vorhanden.</p>' : '';

          snapshot.forEach(docSnap => {
              const inv = docSnap.data();
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                  <div>
                      <strong>An:</strong> ${inv.recipientName} (${inv.recipientEmail})<br>
                      <strong>Wann:</strong> ${inv.date}<br>
                      <a href="${inv.mapsUrl}" target="_blank" style="color:var(--primary-dark)">📍 Maps</a>
                  </div>
                  <button class="small-btn delete-btn" onclick="deleteInvite('${docSnap.id}')">Löschen</button>
              `;
              invList.appendChild(card);
          });
      });
  }

  window.toggleRole = async (uid, currentRole) => {
      const newRole = currentRole === 'admin' ? 'user' : 'admin';
      await updateDoc(doc(db, "users", uid), { role: newRole });
  };

  window.deleteUserDoc = async (uid) => {
      if (confirm("Nutzer aus Datenbank entfernen?")) {
          await deleteDoc(doc(db, "users", uid));
      }
  };

  window.deleteInvite = async (id) => {
      if (confirm("Einladung löschen?")) {
          await deleteDoc(doc(db, "invitations", id));
      }
  };

  // EINLADUNG VORBEREITEN
  document.getElementById('btn-send-invite').addEventListener('click', async () => {
      const selectedChips = Array.from(document.querySelectorAll('.user-chip.selected'));
      const inviteDate = document.getElementById('invite-date').value;
      const details = document.getElementById('invite-details').value.trim();

      if (selectedChips.length === 0 || !inviteDate) return alert("Bitte mindestens einen Nutzer und ein Datum auswählen!");

      const mapsUrl = `https://www.google.com/maps?q=${selectedLat},${selectedLng}`;
      const users = selectedChips.map(chip => JSON.parse(chip.dataset.userData));
      const emails = users.map(u => u.email).join(',');

      for (const u of users) {
          await addDoc(collection(db, "invitations"), {
              recipientEmail: u.email, recipientName: u.name,
              date: inviteDate, details, mapsUrl, createdAt: new Date()
          });
      }

      const subject = encodeURIComponent("Einladung zur Hütte Dangstetten!");
      const body = encodeURIComponent(`Hallo zusammen,\n\ndu wurdest eingeladen!\n\nWann: ${inviteDate}\nInfos: ${details || '-'}\n\nGoogle Maps:\n${mapsUrl}`);
      window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`;
  });

  function loadInvitations(userEmail) {
      const q = query(collection(db, "invitations"), where("recipientEmail", "==", userEmail));
      onSnapshot(q, (snapshot) => {
          const list = document.getElementById('invitation-list');
          list.innerHTML = snapshot.empty ? '<p>Keine Einladungen vorhanden.</p>' : '';
          snapshot.forEach(docSnap => {
              const inv = docSnap.data();
              list.innerHTML += `
                  <div class="card">
                      <div>
                          <strong>📅 ${inv.date}</strong><br>
                          <small>${inv.details || ''}</small><br>
                          <a href="${inv.mapsUrl}" target="_blank" style="color:var(--primary-dark)">📍 Auf Karte anzeigen</a>
                      </div>
                  </div>`;
          });
      });
  }

  // MOBIL-OPTIMIERTE KARTEN-INITIALISIERUNG
  function initMap() {
      setTimeout(() => {
          if (!map) {
              map = L.map('map').setView([selectedLat, selectedLng], 14);

              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 19,
                  attribution: '© OpenStreetMap'
              }).addTo(map);

              marker = L.marker([selectedLat, selectedLng]).addTo(map);

              // Button-Klick: Holt sich die Position der aktuellen Kartenmitte (Fadenkreuz)
              document.getElementById('btn-set-location').addEventListener('click', () => {
                  const center = map.getCenter();
                  selectedLat = center.lat;
                  selectedLng = center.lng;
                  
                  marker.setLatLng(center);
                  document.getElementById('location-status').textContent = '✓ Standort erfolgreich unter dem Fadenkreuz gespeichert!';
              });
          }

          map.invalidateSize();
      }, 400);
  }
</script>

</body>
</html>
